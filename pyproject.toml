[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "indicium-adapters-metagenomics"
version = "0.1.0"
description = "Metagenomics DomainAdapter for the indicium ecosystem: EDAM-backed classification vocabulary and claim/ontology enrichment for shotgun metagenomics"
readme = "README.md"
# 3.11, not the 3.12 the sibling adapters require: this one must be installable
# into the AgenticScienceBuilder conda environment (Python 3.11), which is where
# the classification vocabulary it feeds is consumed.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Louis-Felix Nothias", email = "louis-felix.nothias@cnrs.fr" }]
keywords = [
  "metagenomics", "shotgun-sequencing", "binning", "mag",
  "taxonomic-profiling", "EDAM", "indicium", "ontology", "SSSOM",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["indicium-adapters>=0.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.entry-points."indicium.adapters"]
metagenomics = "indicium_adapters_metagenomics.metagenomics:MetagenomicsAdapter"

[project.urls]
Homepage = "https://github.com/HolobiomicsLab/indicium-adapters-metagenomics"
Repository = "https://github.com/HolobiomicsLab/indicium-adapters-metagenomics"
Issues = "https://github.com/HolobiomicsLab/indicium-adapters-metagenomics/issues"
Changelog = "https://github.com/HolobiomicsLab/indicium-adapters-metagenomics/blob/main/CHANGELOG.md"

# Local-dev resolution for the sibling repos (neither is on PyPI). uv-only and
# stripped from the published wheel; mirrors the genomics sibling's own table.
# Without this, `uv pip install -e .` cannot resolve indicium-adapters at all.
[tool.uv.sources]
indicium-standard = { path = "../indicium", editable = true }
indicium-adapters = { path = "../indicium-adapters", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/indicium_adapters_metagenomics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
